services:
  mongodb:
    image: mongodb/mongodb-atlas-local:preview
    container_name: mongodb-atlas-local
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: root
      MONGODB_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

  init:
    image: python:3.12-slim
    container_name: testai-init
    depends_on:
      - mongodb
    working_dir: /app
    volumes:
      - .:/app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?請設定 OPENAI_API_KEY}
      MONGODB_URI: mongodb://root:root@localhost:27017/?directConnection=true&authSource=admin
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python init.py"
    restart: "no"

volumes:
  mongodb_data:
  mongodb_config:
